<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141c17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AbitofLife">
  <title>AbitofLife · 生活的零碎片段</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <style>
    .topbar{gap:13px}.topbar-right{margin-left:auto;display:flex;gap:7px;align-items:center}.utility-button{border:1px solid #dce6da;background:#fffdf9;border-radius:9px;color:#52735a;padding:8px 10px;font-size:12px;cursor:pointer}.utility-button:focus-visible,.publish-button:focus-visible{outline:3px solid #a6c3a9}.backup-note{margin:13px 0 0;color:#809080;font-size:11px;line-height:1.7}.storage-status{font-size:11px;color:#66836a;margin:14px 0 0}.photo-grid a{cursor:pointer}@media(max-width:600px){.topbar{flex-wrap:wrap;height:auto;min-height:66px;padding:10px 14px}.topbar-right{width:100%;justify-content:flex-end}.utility-button{padding:7px 9px}}
  </style>
  <link rel="stylesheet" href="./dark.css">
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar">
    <div class="brand-mark">a<span>.</span></div>
    <div class="brand-copy"><strong>AbitofLife</strong><small>把日子，留一点下来</small></div>
    <div class="topbar-right">
      <button id="export" class="utility-button" type="button">导出备份</button>
      <button id="import" class="utility-button" type="button">导入备份</button>
      <input id="backup-file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main class="layout">
    <aside class="side-intro"><div class="intro-card"><div class="sun">☀</div><p class="eyebrow">A LITTLE BIT OF LIFE</p><h1>生活里的<br><em>一点点，</em><br>都值得留下。</h1><p class="intro-desc">不必写成长篇。一个瞬间、一句话、一张照片，都是独一无二的今天。</p><div class="intro-rule"></div><span class="side-note">✳ 随心记 · 慢慢翻</span></div></aside>
    <section class="feed">
      <div class="feed-heading"><div><p class="eyebrow">MY LITTLE MOMENTS</p><h2>我的生活记录 <span>✦</span></h2></div><div id="today" class="today-chip"></div></div>
      <div class="composer">
        <div class="composer-top"><div class="avatar">A</div><div><strong>此刻，想记下什么？</strong><p>一点小事，也有它自己的光。</p></div></div>
        <textarea id="content" aria-label="记录文字" placeholder="今天发生了什么，或者你看见了什么……" maxlength="10000"></textarea>
        <div id="selected-photos" class="selected-photos"></div>
        <div class="composer-footer">
          <label class="photo-button">▧ <span>照片</span><input id="file" type="file" accept="image/*" multiple></label>
          <span class="composer-hint">最多 9 张照片</span>
          <button id="publish" class="publish-button" type="button" disabled>记录这一刻 <span>↗</span></button>
        </div>
        <p id="storage-status" class="storage-status"></p>
        <p class="backup-note">记录保存在这台设备的此应用中。请定期导出备份到电脑。</p>
      </div>
      <div id="error" class="error" role="alert" hidden></div>
      <div class="stream-label"><span>时间里的小片段</span><div></div></div>
      <div id="timeline"></div>
      <button id="more" class="more-button" type="button" hidden>看看更早的记录 ↓</button>
      <footer>AbitofLife · 每一天都有一点不一样</footer>
    </section>
    <aside class="right-rail"><div class="quote-card"><span>“</span><p>日子不是重复，<br>只是有些细节<br>等着被看见。</p><small>给每一个普通的今天</small></div><div class="rail-note"><span>✦</span><p>随时记录<br>慢慢回味</p></div></aside>
  </main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
